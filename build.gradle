plugins {
    id 'fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven { name = 'TerraformersMC'; url = 'https://maven.terraformersmc.com/releases/' }
    // Alloy UI (shared Nocturne theme + widgets): ./gradlew publishToMavenLocal in ../alloy-ui
    mavenLocal { content { includeModule 'dev.steelaspect', 'alloy-ui' } }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Alloy UI, bundled inside the jar (jar-in-jar). Client code only (the settings screen, the preview panel).
    modImplementation "dev.steelaspect:alloy-ui:${project.alloyui_version}"
    include "dev.steelaspect:alloy-ui:${project.alloyui_version}"

    // Optional: Mod Menu's config button opens the settings screen.
    // (Mod Menu 9.2.0 pulls a placeholder-api build no repo serves, hence transitive = false)
    modCompileOnly("com.terraformersmc:modmenu:${project.modmenu_version}") { transitive = false }

    // -PwithObe=<path to Optimized Block Entities jar>: test placed labels with a mod that draws closed shulkers itself
    if (project.hasProperty('withObe')) {
        modLocalRuntime files(project.property('withObe'))
    }
    // -PwithSbt=<path to ShulkerBoxTooltip jar>: check icons and bars don't clash with its tooltips and fill bars
    if (project.hasProperty('withSbt')) {
        modLocalRuntime files(project.property('withSbt'))
    }
}

// Client game tests need fabric-client-gametest-api-v1 (1.21.4+): not on 1.20.4 (src/gametest dropped on this branch).
// Instead src/smoketest is a small client mod run by ./smoketest.sh (through ./headless.sh): it joins a dedicated
// 1.20.4 server running the built jar, then one without the mod, checks overlays, previews and keys, and logs
// [ShulkerSmoke] PASS/FAIL.
sourceSets {
    smoketest {
        compileClasspath += main.compileClasspath + main.output
        runtimeClasspath += main.runtimeClasspath + main.output
    }
}
loom {
    mods {
        'cytra-shulkerview' { sourceSet sourceSets.main }
        'cytra-shulkerview-smoke' { sourceSet sourceSets.smoketest }
    }
    runs {
        smokeTest {
            client()
            name 'Smoke test'
            source sourceSets.smoketest
            runDir 'build/run/smoke'
            vmArg '-Dshulkerview.smoke=true'
            programArgs '--username', 'ShulkerSmoke'
            ideConfigGenerated false
        }
    }
}

processResources {
    def props = [version: project.version, minecraft_version: project.minecraft_version]
    inputs.properties props
    filesMatching('fabric.mod.json') {
        expand props
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = 'UTF-8'
    it.options.release = 17
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

// Test games start muted.
tasks.matching { it.name == 'runSmokeTest' }.configureEach {
    doFirst {
        def options = file('build/run/smoke/options.txt')
        options.parentFile.mkdirs()
        def lines = options.exists() ? options.readLines().findAll { !it.startsWith('soundCategory_master:') } : []
        options.text = (lines + 'soundCategory_master:0.0').join('\n') + '\n'
    }
}
