plugins {
    id 'fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven { name = 'TerraformersMC'; url = 'https://maven.terraformersmc.com/releases/' }
    // Alloy UI (shared Nocturne theme + widgets): ./gradlew publishToMavenLocal in ../alloy-ui
    mavenLocal { content { includeModule 'dev.steelaspect', 'alloy-ui' } }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Alloy UI, bundled inside the jar (jar-in-jar). Client code only (the settings screen).
    modImplementation "dev.steelaspect:alloy-ui:${project.alloyui_version}"
    include "dev.steelaspect:alloy-ui:${project.alloyui_version}"

    // Optional: Mod Menu's config button opens the settings screen.
    modCompileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"

    // -PwithObe=<path to Optimized Block Entities jar>: test placed labels with a mod that draws closed shulkers itself
    if (project.hasProperty('withObe')) {
        modLocalRuntime files(project.property('withObe'))
    }
    // -PwithSbt=<path to ShulkerBoxTooltip jar>: check icons and bars don't clash with its tooltips and fill bars
    if (project.hasProperty('withSbt')) {
        modLocalRuntime files(project.property('withSbt'))
    }
}

// In-game client tests (src/gametest), run with ./gradlew runClientGameTest. Not part of the mod jar.
fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'cytra-shulkerview-test'
        enableGameTests = false
        enableClientGameTests = true
        eula = true
        clearRunDirectory = true
    }
}

processResources {
    def props = [version: project.version, minecraft_version: project.minecraft_version]
    inputs.properties props
    filesMatching('fabric.mod.json') {
        expand props
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = 'UTF-8'
    it.options.release = 21
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

// Test games start muted. -PalloyPack=<Alloy Pack zip> runs the named shulker texture test; -PnamedOnly skips the rest.
tasks.matching { it.name == 'runClientGameTest' }.configureEach {
    if (project.hasProperty('alloyPack')) jvmArgs "-Dshulkerview.alloyPack=${file(project.property('alloyPack'))}"
    if (project.hasProperty('namedOnly')) jvmArgs '-Dshulkerview.namedOnly=true'
    doFirst {
        def options = file('build/run/clientGameTest/options.txt')
        options.parentFile.mkdirs()
        def lines = options.exists() ? options.readLines().findAll { !it.startsWith('soundCategory_master:') } : []
        options.text = (lines + 'soundCategory_master:0.0').join('\n') + '\n'
    }
}
